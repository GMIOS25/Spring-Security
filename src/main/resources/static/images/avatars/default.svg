  <circle cx="100" cy="100" r="98" fill="url(#default-bg)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <g transform="translate(100, 100)">
    <!-- Head -->
