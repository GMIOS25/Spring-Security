<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="charlie-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="charlie-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#charlie-bg)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <g transform="translate(100, 105)" filter="url(#charlie-shadow)">
    <!-- Neck & Denim Jacket -->
    <path d="M-13,24 L13,24 L15,40 L-15,40 Z" fill="#ffedd5"/>
    <path d="M-44,65 C-42,36 -22,32 0,32 C22,32 42,36 44,65 Z" fill="#312e81"/>
    <path d="M-14,32 L0,50 L14,32" fill="#e0e7ff"/>
    <line x1="0" y1="50" x2="0" y2="65" stroke="#f43f5e" stroke-width="2"/>

    <!-- Head & Face -->
    <ellipse cx="0" cy="-4" rx="27" ry="31" fill="#ffedd5"/>

    <!-- Stylish Beanie / Hair -->
    <path d="M-28,-14 C-30,-48 30,-48 28,-14 C22,-18 10,-20 0,-20 C-10,-20 -22,-18 -28,-14 Z" fill="#1e1b4b"/>
    <!-- Beanie Fold -->
    <rect x="-29" y="-22" width="58" height="12" rx="4" fill="#4338ca"/>

    <!-- Stylish Tortoiseshell Glasses -->
    <circle cx="-11" cy="-4" r="9" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="11" cy="-4" r="9" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="-2" y1="-4" x2="2" y2="-4" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Eyes -->
    <circle cx="-11" cy="-4" r="2.8" fill="#1e1b4b"/>
    <circle cx="-10" cy="-5" r="1" fill="#ffffff"/>
    <circle cx="11" cy="-4" r="2.8" fill="#1e1b4b"/>
    <circle cx="12" cy="-5" r="1" fill="#ffffff"/>

    <!-- Smile -->
    <path d="M-5,11 Q0,17 5,11" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
