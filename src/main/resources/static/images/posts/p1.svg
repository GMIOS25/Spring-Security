<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Sky Gradient: Sunset / Golden Hour -->
    <linearGradient id="p1-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#701a75"/>
      <stop offset="65%" stop-color="#c026d3"/>
      <stop offset="85%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <!-- Water Gradient: Reflective Twilight Bay -->
    <linearGradient id="p1-water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="30%" stop-color="#581c87"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Sun Glow -->
    <radialGradient id="p1-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="420" fill="url(#p1-sky)"/>

  <!-- Golden Sun -->
  <circle cx="340" cy="300" r="80" fill="url(#p1-sun)"/>

  <!-- Distant Mountains -->
  <path d="M0,380 L80,330 L180,365 L270,320 L380,360 L490,325 L600,375 L600,420 L0,420 Z" fill="#4a044e" opacity="0.6"/>

  <!-- Water Bay -->
  <rect y="415" width="600" height="185" fill="url(#p1-water)"/>

  <!-- Sun Reflection on Water -->
  <ellipse cx="340" cy="425" rx="60" ry="6" fill="#fde047" opacity="0.6"/>
  <ellipse cx="340" cy="440" rx="45" ry="4" fill="#fde047" opacity="0.5"/>
  <ellipse cx="340" cy="455" rx="35" ry="3" fill="#fde047" opacity="0.4"/>
  <ellipse cx="340" cy="470" rx="25" ry="2.5" fill="#fde047" opacity="0.3"/>
  <ellipse cx="340" cy="490" rx="18" ry="2" fill="#fde047" opacity="0.2"/>

  <!-- City Skyline Silhouettes -->
  <!-- Back Row Buildings -->
  <path d="M60,415 L60,260 L95,260 L95,290 L120,290 L120,415 L170,415 L170,230 L195,200 L220,230 L220,415 L360,415 L360,280 L400,280 L400,415 L430,415 L430,240 L460,240 L460,415 Z" fill="#2e1065"/>
  <!-- Front Row Buildings (Deep Twilight) -->
  <path d="M0,415 L0,320 L35,320 L35,415 L130,415 L130,250 L160,250 L160,415 L230,415 L230,180 L235,140 L240,180 L270,180 L270,415 L285,415 L285,260 L320,260 L320,415 L470,415 L470,210 L510,210 L510,415 L530,415 L530,290 L570,290 L570,415 L600,415 L600,415 Z" fill="#1e1b4b"/>

  <!-- Glowing Skyscraper Windows -->
  <g fill="#fef08a" opacity="0.85">
    <rect x="138" y="260" width="4" height="4"/><rect x="148" y="260" width="4" height="4"/>
    <rect x="138" y="275" width="4" height="4"/><rect x="148" y="275" width="4" height="4"/>
    <rect x="138" y="290" width="4" height="4"/><rect x="148" y="290" width="4" height="4"/>
    <rect x="138" y="320" width="4" height="4"/><rect x="148" y="320" width="4" height="4"/>
    <rect x="138" y="350" width="4" height="4"/><rect x="148" y="350" width="4" height="4"/>
    <!-- Center Tower -->
    <rect x="240" y="200" width="4" height="4"/><rect x="255" y="200" width="4" height="4"/>
    <rect x="240" y="215" width="4" height="4"/><rect x="255" y="215" width="4" height="4"/>
    <rect x="240" y="235" width="4" height="4"/><rect x="255" y="235" width="4" height="4"/>
    <rect x="240" y="260" width="4" height="4"/><rect x="255" y="260" width="4" height="4"/>
    <rect x="240" y="290" width="4" height="4"/><rect x="255" y="290" width="4" height="4"/>
    <rect x="240" y="320" width="4" height="4"/><rect x="255" y="320" width="4" height="4"/>
    <!-- Right Tower -->
    <rect x="480" y="225" width="4" height="4"/><rect x="495" y="225" width="4" height="4"/>
    <rect x="480" y="245" width="4" height="4"/><rect x="495" y="245" width="4" height="4"/>
    <rect x="480" y="270" width="4" height="4"/><rect x="495" y="270" width="4" height="4"/>
    <rect x="480" y="300" width="4" height="4"/><rect x="495" y="300" width="4" height="4"/>
    <rect x="480" y="330" width="4" height="4"/><rect x="495" y="330" width="4" height="4"/>
  </g>

  <!-- Foreground Pier & Palm Trees Silhouette -->
  <polygon points="0,520 180,600 0,600" fill="#090d16"/>
  <!-- Palm Tree Trunk -->
  <path d="M40,600 Q75,510 65,420" stroke="#090d16" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Palm Fronds -->
  <path d="M65,420 Q30,400 0,420" stroke="#090d16" stroke-width="5" fill="none"/>
  <path d="M65,420 Q40,380 20,385" stroke="#090d16" stroke-width="5" fill="none"/>
  <path d="M65,420 Q65,365 75,370" stroke="#090d16" stroke-width="5" fill="none"/>
  <path d="M65,420 Q95,380 120,390" stroke="#090d16" stroke-width="5" fill="none"/>
  <path d="M65,420 Q105,410 135,430" stroke="#090d16" stroke-width="5" fill="none"/>

  <!-- Aesthetic Photo Tag Overlay in Corner -->
  <g transform="translate(470, 550)">
    <rect width="105" height="32" rx="16" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#fb7185"/>
    <text x="58" y="21" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">TOKYO 18:45</text>
  </g>
</svg>
