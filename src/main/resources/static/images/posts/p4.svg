<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Night City Sky -->
    <linearGradient id="p4-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="60%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#180a24"/>
    </linearGradient>
    <!-- Wet Asphalt Reflections -->
    <linearGradient id="p4-asphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <!-- Neon Magenta Glow -->
    <filter id="p4-magenta-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Neon Cyan Glow -->
    <filter id="p4-cyan-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="600" fill="url(#p4-sky)"/>

  <!-- Background Skyscrapers with Grid Pattern -->
  <path d="M40,430 L40,160 L140,160 L140,430 L180,430 L180,100 L280,70 L280,430 L350,430 L350,130 L450,130 L450,430 L480,430 L480,200 L560,200 L560,430 Z" fill="#0f0f1d"/>

  <!-- Cyan Skyscraper Grid Lines -->
  <g stroke="#06b6d4" stroke-width="1" opacity="0.3">
    <line x1="195" y1="120" x2="265" y2="120"/>
    <line x1="195" y1="150" x2="265" y2="150"/>
    <line x1="195" y1="180" x2="265" y2="180"/>
    <line x1="195" y1="210" x2="265" y2="210"/>
    <line x1="195" y1="240" x2="265" y2="240"/>
    <line x1="195" y1="270" x2="265" y2="270"/>
    <line x1="365" y1="160" x2="435" y2="160"/>
    <line x1="365" y1="200" x2="435" y2="200"/>
    <line x1="365" y1="240" x2="435" y2="240"/>
  </g>

  <!-- Midground Alley Buildings & Overhanging Neon Billboards -->
  <polygon points="0,180 120,230 120,450 0,470" fill="#181829"/>
  <polygon points="600,160 480,220 480,450 600,470" fill="#181829"/>

  <!-- Left Neon Sign (Vertical Japanese Cyberpunk) -->
  <g transform="translate(60, 240)">
    <rect x="-10" y="-10" width="36" height="130" rx="8" fill="#09090b" stroke="#f43f5e" stroke-width="2" filter="url(#p4-magenta-glow)"/>
    <text x="8" y="22" text-anchor="middle" fill="#ff2a6d" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#p4-magenta-glow)">新</text>
    <text x="8" y="52" text-anchor="middle" fill="#ff2a6d" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#p4-magenta-glow)">宿</text>
    <text x="8" y="82" text-anchor="middle" fill="#05d9e8" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#p4-cyan-glow)">電</text>
    <text x="8" y="112" text-anchor="middle" fill="#05d9e8" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#p4-cyan-glow)">脳</text>
  </g>

  <!-- Right Neon Sign (Horizontal Cyber Bar) -->
  <g transform="translate(490, 260)">
    <rect x="-12" y="-12" width="110" height="42" rx="6" fill="#09090b" stroke="#00f2fe" stroke-width="2" filter="url(#p4-cyan-glow)"/>
    <text x="42" y="15" text-anchor="middle" fill="#00f2fe" font-family="monospace" font-size="14" font-weight="800" letter-spacing="2" filter="url(#p4-cyan-glow)">CYBER</text>
  </g>

  <!-- Mid Overhead Crosswalk / Cables -->
  <path d="M120,280 Q300,320 480,270" stroke="#000000" stroke-width="5" fill="none"/>
  <path d="M120,310 Q300,350 480,300" stroke="#000000" stroke-width="3" fill="none"/>
  <!-- Holographic Floating Ring in Center of Street -->
  <ellipse cx="300" cy="310" rx="45" ry="12" fill="none" stroke="#d946ef" stroke-width="3" filter="url(#p4-magenta-glow)"/>

  <!-- Wet Asphalt Ground Street (Perspective Angle) -->
  <polygon points="0,470 600,470 600,600 0,600" fill="url(#p4-asphalt)"/>
  <line x1="0" y1="470" x2="600" y2="470" stroke="#262626" stroke-width="2"/>

  <!-- Wet Street Reflections (Vertical Gradient Blurs) -->
  <!-- Left Magenta Spill -->
  <polygon points="40,470 120,470 160,600 20,600" fill="#f43f5e" opacity="0.3" filter="url(#p4-magenta-glow)"/>
  <!-- Center Cyan Spill -->
  <polygon points="260,470 340,470 360,600 240,600" fill="#00f2fe" opacity="0.25" filter="url(#p4-cyan-glow)"/>
  <!-- Right Amber/Cyan Spill -->
  <polygon points="470,470 540,470 590,600 450,600" fill="#00f2fe" opacity="0.3" filter="url(#p4-cyan-glow)"/>

  <!-- Perspective Center Lane Lines -->
  <polygon points="296,470 304,470 310,600 290,600" fill="#38bdf8" opacity="0.4"/>

  <!-- Photo Location Badge -->
  <g transform="translate(430, 550)">
    <rect width="145" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#00f2fe"/>
    <text x="79" y="21" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">NEO-SHINJUKU 02:00</text>
  </g>
</svg>
