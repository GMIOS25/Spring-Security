<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Alpine Twilight Sky -->
    <linearGradient id="p3-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#312e81"/>
      <stop offset="90%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="p3-moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="600" fill="url(#p3-sky)"/>

  <!-- Sparkling Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="160" cy="50" r="1" opacity="0.6"/>
    <circle cx="220" cy="110" r="2" opacity="0.9"/>
    <circle cx="310" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="390" cy="130" r="1" opacity="0.5"/>
    <circle cx="480" cy="60" r="2.5" opacity="0.95"/>
    <circle cx="530" cy="140" r="1" opacity="0.8"/>
    <circle cx="120" cy="150" r="1.5" opacity="0.6"/>
    <circle cx="270" cy="40" r="1.2" opacity="0.75"/>
    <circle cx="430" cy="80" r="1.8" opacity="0.85"/>
  </g>

  <!-- Crescent Moon with Ambient Glow -->
  <circle cx="480" cy="120" r="50" fill="url(#p3-moon-glow)" opacity="0.4"/>
  <path d="M495,100 C480,105 470,120 470,135 C470,155 488,168 505,160 C490,165 475,155 475,138 C475,122 485,108 495,100 Z" fill="#fef08a"/>

  <!-- Distant Layer 1 Mountains (Soft Purple) -->
  <path d="M0,420 L70,330 L160,390 L260,280 L350,370 L460,260 L550,340 L600,300 L600,600 L0,600 Z" fill="#4338ca" opacity="0.5"/>

  <!-- Mid Layer 2 Mountains (Deep Indigo) -->
  <path d="M0,450 L110,360 L210,430 L310,340 L400,420 L510,320 L600,380 L600,600 L0,600 Z" fill="#312e81" opacity="0.8"/>

  <!-- Foreground Mountain Ridge (Navy Shadow) -->
  <path d="M0,500 L90,430 L220,490 L340,410 L440,480 L560,400 L600,440 L600,600 L0,600 Z" fill="#1e1b4b"/>

  <!-- Pine Forest Silhouettes -->
  <!-- Layer 1 Pines (Dark Purple) -->
  <g fill="#0f172a">
    <!-- Cluster Left -->
    <polygon points="20,530 30,470 40,530"/><polygon points="23,500 30,460 37,500"/>
    <polygon points="45,545 60,465 75,545"/><polygon points="49,495 60,450 71,495"/>
    <polygon points="80,560 95,480 110,560"/><polygon points="84,510 95,465 106,510"/>
    <!-- Cluster Center -->
    <polygon points="230,550 245,475 260,550"/><polygon points="234,505 245,460 256,505"/>
    <polygon points="265,565 285,460 305,565"/><polygon points="270,490 285,445 300,490"/>
    <polygon points="310,555 325,480 340,555"/><polygon points="314,510 325,465 336,510"/>
    <!-- Cluster Right -->
    <polygon points="450,560 470,455 490,560"/><polygon points="455,490 470,440 485,490"/>
    <polygon points="500,545 515,470 530,545"/><polygon points="504,500 515,455 526,500"/>
    <polygon points="540,550 560,440 580,550"/><polygon points="545,475 560,425 575,475"/>
  </g>

  <!-- Deep Foreground Ridge -->
  <path d="M0,570 Q150,540 300,565 T600,550 L600,600 L0,600 Z" fill="#020617"/>

  <!-- Photo Location Badge -->
  <g transform="translate(440, 550)">
    <rect width="135" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#a855f7"/>
    <text x="74" y="21" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ALPINE HORIZON</text>
  </g>
</svg>
