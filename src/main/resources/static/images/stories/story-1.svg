<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="450" height="800">
  <defs>
    <linearGradient id="story-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="40%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <rect width="450" height="800" fill="url(#story-grad-1)"/>

  <!-- Subtle Story Circles -->
  <circle cx="225" cy="400" r="170" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="225" cy="400" r="230" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="10 10"/>

  <!-- Centered Floating Glass Card -->
  <g transform="translate(45, 260)">
    <rect width="360" height="280" rx="24" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    
    <text x="180" y="55" text-anchor="middle" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="2">
      INSTACLONE STORY
    </text>
    
    <text x="180" y="115" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800">
      Spring Security 7.x
    </text>
    
    <text x="180" y="160" text-anchor="middle" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">
      Deep dive into Zero Trust Architecture!
    </text>

    <!-- Tap Badge -->
    <rect x="110" y="210" width="140" height="38" rx="19" fill="#e11d48"/>
    <text x="180" y="234" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">
      @alice
    </text>
  </g>
</svg>
