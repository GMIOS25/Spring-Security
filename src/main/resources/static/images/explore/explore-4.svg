  </g>

  <!-- Bottom Banner Details -->
  <rect x="0" y="470" width="600" height="130" fill="rgba(9, 9, 11, 0.85)"/>
  <rect x="40" y="495" width="90" height="24" rx="6" fill="#f43f5e"/>
  <text x="85" y="511" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">PHOTOGRAPHY</text>
  <text x="40" y="555" fill="#ffffff" font-family="'Inter', sans-serif" font-size="20" font-weight="700">Cyberpunk Alley at Midnight</text>
