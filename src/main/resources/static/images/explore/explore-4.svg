      <stop offset="0%" stop-color="#05051a"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#exp-bg)"/>

  <!-- Centered Artwork -->
