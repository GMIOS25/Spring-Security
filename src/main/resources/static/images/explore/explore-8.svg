      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#323244"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#exp-bg)"/>

  <!-- Centered Artwork -->
  <g transform="translate(300, 270)">
    
      <g stroke="#ffffff" stroke-width="2" fill="none">
        <rect x="-110" y="-110" width="70" height="70"/>
