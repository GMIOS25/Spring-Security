        <rect x="70" y="-110" width="40" height="70"/>
        <rect x="-110" y="-20" width="70" height="70" fill="rgba(244,63,94,0.4)"/>
        <rect x="-20" y="-20" width="70" height="70" fill="rgba(56,189,248,0.4)"/>
        <rect x="-110" y="70" width="70" height="40"/>
        <rect x="-20" y="70" width="70" height="40"/>
      </g>
    
  </g>

  <!-- Bottom Banner Details -->
  <rect x="0" y="470" width="600" height="130" fill="rgba(9, 9, 11, 0.85)"/>
  <rect x="40" y="495" width="90" height="24" rx="6" fill="#f43f5e"/>
  <text x="85" y="511" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">ARCHITECTURE</text>
